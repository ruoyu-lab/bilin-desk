# 由 Server/deploy/deploy-production.sh 装到 /etc/nginx/conf.d/admin.bilindesk.com.conf
# 管理后台（docs/admin.md）admin.bilindesk.com：网页是静态文件（Server/admin 编出来的，在 /var/www/admin.bilindesk.com），
# 接口（/api/）转给它的进程（127.0.0.1:3100）。自己一个域名：浏览器里和官网、网页版的数据互相碰不到。
# 证书和 www 是同一张（bilindesk.com.conf）

server {
    listen 80;
    listen [::]:80;
    server_name admin.bilindesk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://admin.bilindesk.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bilindesk:1m;

    # 隐私政策：不记访问日志；出错的记下来排查，保留 14 天（/etc/logrotate.d/bilin）
    error_log /var/log/bilin/nginx-error.log warn;

    root /var/www/admin.bilindesk.com;

    # 网页：不能被别的网站嵌进去、只用自己的脚本和样式、不把地址带给别处，不让搜索引擎收
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }

    # 接口：转给管理后台的进程
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 立即备份要等 mongodump 导完
        proxy_read_timeout 300s;
        # 发布新版本时上传的安装包：直接转给后台，后台边收边存
        client_max_body_size 1g;
        proxy_request_buffering off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
    }
}
