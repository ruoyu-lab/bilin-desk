# 由 Server/deploy/deploy-production.sh 装到 /etc/nginx/conf.d/bilindesk.com.conf
# 比邻的网站 www.bilindesk.com：官网（静态文件，在 /var/www/bilindesk.com）、程序连的服务端（/ws）、
# 新版本（/updates/）、提交反馈（/feedback）。不带 www 的 bilindesk.com 都转过来。管理后台在自己的域名上
# （admin.bilindesk.com.conf）。
# 证书是 Let's Encrypt 的（deploy-production.sh 申请，bilindesk.com、www、admin、web 几个名字一张，certbot 自动续期）。
# https 不直接听 443：服务器上 443 是 Xray（VPN，Reality），不是 VPN 的连接原样转给 127.0.0.1:4443，前面带着 PROXY 协议
# 说真实的地址（01-realip.conf 换成它）。
# 服务端的两个实例（PM2）共用 127.0.0.1:3000
upstream bilin {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 长连接（WebSocket）升级时转发 Upgrade / Connection，普通请求复用到上游的连接
map $http_upgrade $bilin_connection {
    default upgrade;
    ''      '';
}

# http：只回答申请、续期证书的验证，别的都转到 https
server {
    listen 80;
    listen [::]:80;
    server_name bilindesk.com www.bilindesk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.bilindesk.com$request_uri;
    }
}

# 不带 www 的：转到 www
server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    http2 on;
    server_name bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.bilindesk.com$request_uri;
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    http2 on;
    server_name www.bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bilindesk:1m;

    # 隐私政策：不记访问日志；出错的记下来排查，保留 14 天（/etc/logrotate.d/bilin）
    error_log /var/log/bilin/nginx-error.log warn;

    root /var/www/bilindesk.com;

    # 官网（Website 编出来的）
    location / {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 程序和服务端的长连接
    location = /ws {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 服务端每 30 秒 ping 一次，长连接平时不会安静这么久
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # 程序看有没有新版本、下载安装包，官网的下载按钮也问它（服务端发，docs/admin.md）
    location /updates/ {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        # 安装包不先存到 Nginx 的临时文件里
        proxy_max_temp_file_size 0;
    }

    # 用户在程序里提交反馈（服务端收，src/feedback.ts）：带着日志，最大 8 MB
    location = /feedback {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8m;
    }
}
