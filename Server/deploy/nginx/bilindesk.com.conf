# 由 Server/deploy/deploy-production.sh 装到 /etc/nginx/conf.d/bilindesk.com.conf
# 比邻的网站 www.bilindesk.com：官网和管理后台的网页（静态文件，在 /var/www/bilindesk.com）、程序连的服务端（/ws）、
# 新版本（/updates/）、管理后台的接口（/admin/api/）。不带 www 的 bilindesk.com 都转过来。
# 证书是 Let's Encrypt 的（setup-production.sh 申请，两个名字一张，certbot 自动续期）。
# 服务端的两个实例（PM2）共用 127.0.0.1:3000，管理后台在 127.0.0.1:3100
upstream bilin {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 长连接（WebSocket）升级时转发 Upgrade / Connection，普通请求复用到上游的连接
map $http_upgrade $bilin_connection {
    default upgrade;
    ''      '';
}

# http：只回答申请、续期证书的验证，别的都转到 https
server {
    listen 80;
    listen [::]:80;
    server_name bilindesk.com www.bilindesk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.bilindesk.com$request_uri;
    }
}

# 不带 www 的：转到 www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.bilindesk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bilindesk:1m;

    # 隐私政策：不记访问日志；出错的记下来排查，保留 14 天（/etc/logrotate.d/bilin）
    error_log /var/log/bilin/nginx-error.log warn;

    root /var/www/bilindesk.com;

    # 官网（Website 编出来的）
    location / {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 程序和服务端的长连接
    location = /ws {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 服务端每 30 秒 ping 一次，长连接平时不会安静这么久
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # 程序看有没有新版本、下载安装包，官网的下载按钮也问它（服务端发，docs/admin.md）
    location /updates/ {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        # 安装包不先存到 Nginx 的临时文件里
        proxy_max_temp_file_size 0;
    }

    # 管理后台（docs/admin.md）：网页是静态文件（Server/admin 编出来的）。不能被别的网站嵌进去、只用自己的脚本和样式、
    # 不把地址带给别处
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }

    # 管理后台的接口：转给它的进程
    location /admin/api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 立即备份要等 mongodump 导完
        proxy_read_timeout 300s;
        # 发布新版本时上传的安装包：直接转给后台，后台边收边存
        client_max_body_size 1g;
        proxy_request_buffering off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
