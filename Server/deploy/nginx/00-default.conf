# 由 Server/deploy/setup-production.sh 装到 /etc/nginx/conf.d/00-default.conf
# 不认识的域名、直接用 IP 地址来的：http 只回答申请证书的验证（新网站的配置装上之前先在这里申请证书），
# 别的直接断开；https 不握手（没有它的证书）
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
