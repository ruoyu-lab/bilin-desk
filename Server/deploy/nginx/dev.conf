# 由 Server/deploy/deploy-dev.sh 装到开发用的虚拟机的 /etc/nginx/conf.d/bilin.conf
# 和正式的服务器一样的几个地址（nginx/bilindesk.com.conf），只是 http、8800 端口，没有官网。
# 开发时 OrbStack 把虚拟机的端口转到 Mac 上（局域网里的 Windows 连 Mac 的地址:8800）；80 端口留给 Mac 上别的虚拟机
upstream bilin {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $bilin_connection {
    default upgrade;
    ''      '';
}

server {
    listen 8800;
    listen [::]:8800;

    root /var/www/bilin-dev;

    location = /ws {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /updates/ {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        proxy_max_temp_file_size 0;
    }

    location = /feedback {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8m;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache always;
    }

    location /admin/api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # 带着端口：后台核对改动请求的 Origin 和它对得上
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 1g;
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}
