# 由 Server/deploy/setup-production.sh 装到 /etc/nginx/nginx.conf：Rocky 自带的那份，去掉了里面的默认网站。
# 每个网站在 conf.d 里有自己的一份（按域名起名，比如 bilindesk.com.conf）；不认识的域名、直接用 IP 地址来的
# 由 conf.d/00-default.conf 回答
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 不说 Nginx 的版本号；不记访问日志（要记的网站在自己的配置里打开）
    server_tokens off;
    access_log off;

    include /etc/nginx/conf.d/*.conf;
}
