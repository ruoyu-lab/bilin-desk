# 由 Server/deploy/deploy-production.sh 装到 /etc/nginx/conf.d/web.bilindesk.com.conf
# 网页版（docs/web.md）web.bilindesk.com：网页是静态文件（Web 编出来的，带 SDK 的浏览器包，在 /var/www/web.bilindesk.com），
# 账号、要连电脑时的通行证（/web/）给服务端（127.0.0.1:3000），浏览器经转发进程（/relay，127.0.0.1:3200）连电脑。
# 自己一个域名：浏览器里和官网、管理后台的数据互相碰不到。证书和 www 是同一张（bilindesk.com.conf）

server {
    listen 80;
    listen [::]:80;
    server_name web.bilindesk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://web.bilindesk.com$request_uri;
    }
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    http2 on;
    server_name web.bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bilindesk:1m;

    # 隐私政策：不记访问日志；出错的记下来排查，保留 14 天（/etc/logrotate.d/bilin）
    error_log /var/log/bilin/nginx-error.log warn;

    root /var/www/web.bilindesk.com;

    # 网页和 SDK 的浏览器包。SDK 用多线程（SharedArrayBuffer），要跨源隔离（COOP、COEP）；页面里有连接用的临时密码和
    # 画面，只用自己的脚本（加编译 WebAssembly）、只连自己（SDK 的 docs/guide/23-browser.md），不能被别的网站嵌进去，
    # 不让搜索引擎收
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # SDK 的浏览器包：系统的 MIME 表里没有 .mjs（模块脚本必须是 JavaScript 的类型）；它的 Worker 也要跨源隔离的头
    location /sdk/ {
        types {
            text/javascript js mjs;
            application/wasm wasm;
        }
        add_header Cache-Control no-cache always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 构建出来的文件名带着内容的哈希：可以一直缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 网页版的接口：账号、要连一台电脑（服务端，src/web.ts）。带着原来的 Host：服务端核对改东西的请求的 Origin
    location /web/ {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 浏览器经转发进程连电脑（WebSocket）
    location = /relay {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 转发进程每 30 秒 ping 一次
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
