# 比邻：bilindesk.com、admin.、web.，由 /srv/gateway 的 Nginx 读（include /srv/*/nginx/*.conf）
# 服务端两个实例 127.0.0.1:3000 和 3001
upstream bilin {
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    keepalive 32;
}
map $http_upgrade $bilin_connection {
    default upgrade;
    ''      '';
}
server {
    listen 80;
    listen [::]:80;
    server_name bilindesk.com www.bilindesk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.bilindesk.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.bilindesk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bilindesk:1m;

    root /srv/bilin/www/site;
    location / {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /ws {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location /updates/ {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        proxy_max_temp_file_size 0;
    }
    location = /feedback {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8m;
    }
    location = /relay {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.bilindesk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://admin.bilindesk.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bilindesk:1m;

    root /srv/bilin/www/admin;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 1g;
        proxy_request_buffering off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name web.bilindesk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://web.bilindesk.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.bilindesk.com;

    ssl_certificate /etc/letsencrypt/live/bilindesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilindesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bilindesk:1m;

    root /srv/bilin/www/web;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location /sdk/ {
        types {
            text/javascript js mjs;
            application/wasm wasm;
        }
        add_header Cache-Control no-cache always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /web/ {
        proxy_pass http://bilin;
        proxy_http_version 1.1;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /relay {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bilin_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
